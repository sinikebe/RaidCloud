name: Beta Build

on:
  push:
    branches-ignore:
      - main
      # Dependency bumps are validated by ci.yml on their pull request; a beta
      # binary for each one is just wasted runner time.
      - "dependabot/**"

# Least privilege: this workflow only reads the code and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build beta binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libfuse3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fuse]"
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/

      - name: Compute beta version label
        id: version
        run: |
          BASE=$(python -c "import re; m=re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          LABEL="${BASE}-beta.${GITHUB_RUN_NUMBER}.${BRANCH_SLUG}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Build Linux binary
        run: python scripts/build.py --target linux

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: raidcloud-linux-amd64-${{ steps.version.outputs.label }}
          path: dist/linux/raidcloud
          if-no-files-found: error
