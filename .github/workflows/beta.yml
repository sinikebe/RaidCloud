name: Beta Build

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build beta binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/

      - name: Compute beta version label
        id: version
        run: |
          BASE=$(python -c "import re; m=re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          LABEL="${BASE}-beta.${GITHUB_RUN_NUMBER}.${BRANCH_SLUG}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Build Linux binary
        run: python scripts/build.py --target linux

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: raidcloud-linux-amd64-${{ steps.version.outputs.label }}
          path: dist/linux/raidcloud
          if-no-files-found: error
