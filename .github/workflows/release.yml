name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      # ── Linux binary ──────────────────────────────────────────────────────
      - name: Build Linux binary
        run: python scripts/build.py --target linux

      # ── Wine + Windows Python setup ───────────────────────────────────────
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y wine wine64 winbind

      - name: Setup Wine Python & deps
        run: bash scripts/setup_wine.sh
        env:
          WINEDEBUG: "-all"

      # ── Windows binary ────────────────────────────────────────────────────
      - name: Build Windows binary
        run: python scripts/build.py --target windows
        env:
          WINEDEBUG: "-all"

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: raidcloud-linux-amd64
          path: dist/linux/raidcloud
          if-no-files-found: error

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: raidcloud-windows-amd64
          path: dist/windows/raidcloud.exe
          if-no-files-found: error

      # ── Create GitHub Release (tag pushes only) ───────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/raidcloud
            dist/windows/raidcloud.exe
          generate_release_notes: true
