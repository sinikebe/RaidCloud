name: Release

on:
  push:
    branches:
      - main

# Allow pushing the version-bump commit and tag back to the repo
permissions:
  contents: write

jobs:
  release:
    name: Bump version, build, and release
    runs-on: ubuntu-latest
    # Skip the run triggered by the version-bump commit itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libfuse3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fuse]"
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest tests/

      # ── Auto-increment patch version ───────────────────────────────────────
      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(python -c "import re; m=re.search(r'version = \"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/version = \"${CURRENT}\"/version = \"${NEW}\"/" pyproject.toml
          sed -i "s/__version__ = \"${CURRENT}\"/__version__ = \"${NEW}\"/" raidcloud/__init__.py
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml raidcloud/__init__.py
          git commit -m "chore: bump version to ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

      # ── Linux binary ──────────────────────────────────────────────────────
      - name: Build Linux binary
        run: python scripts/build.py --target linux

      # ── Wine + Windows Python setup ───────────────────────────────────────
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y wine wine64 winbind

      - name: Setup Wine Python & deps
        run: bash scripts/setup_wine.sh
        env:
          WINEDEBUG: "-all"

      # ── Windows binary ────────────────────────────────────────────────────
      - name: Build Windows binary
        run: python scripts/build.py --target windows
        env:
          WINEDEBUG: "-all"

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: raidcloud-linux-amd64
          path: dist/linux/raidcloud
          if-no-files-found: error

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: raidcloud-windows-amd64
          path: dist/windows/raidcloud.exe
          if-no-files-found: error

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            dist/linux/raidcloud
            dist/windows/raidcloud.exe
          generate_release_notes: true
