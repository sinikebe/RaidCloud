name: Bug report
description: Something in RaidCloud does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do **not** paste access tokens, secret
        keys or the unredacted contents of `~/.raidcloud/config.yaml`.
        Use `raidcloud config show`, which redacts known secret keys.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. raidcloud config init
        2. raidcloud push ./file.txt remote/file.txt
        3. ...
    validations:
      required: true

  - type: dropdown
    id: raid-mode
    attributes:
      label: RAID mode
      options: [mirror, stripe, split, secret_sharing, "not applicable"]
    validations:
      required: true

  - type: checkboxes
    id: providers
    attributes:
      label: Providers involved
      options:
        - label: Dropbox
        - label: AWS S3 / S3-compatible
        - label: Google Drive
        - label: OneDrive

  - type: input
    id: version
    attributes:
      label: RaidCloud version
      description: Output of `raidcloud --version`
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Tracebacks or command output. Redact any credentials.
      render: shell
