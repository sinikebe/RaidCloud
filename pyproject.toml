[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raidcloud"
version = "0.1.1"
description = "Aggregate multiple cloud providers into a RAID-like virtual disk"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cloud", "raid", "fuse", "storage", "backup"]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "dropbox>=12.0",
    "boto3>=1.38",
    "google-api-python-client>=2.160",
    "google-auth-oauthlib>=1.2",
    "msal>=1.30",
    "requests>=2.32",
    "cryptography>=46.0.5",
]

[project.optional-dependencies]
fuse = ["pyfuse3>=3.3", "trio>=0.25"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pyinstaller>=6.0",
]

[project.scripts]
raidcloud = "raidcloud.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["raidcloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
